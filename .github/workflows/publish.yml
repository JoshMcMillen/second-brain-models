name: Publish signed model catalog

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Catalog channel
        required: true
        type: choice
        options: [test, beta, stable]
      catalog_version:
        description: New monotonic catalog version
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: model-catalog-publish-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: model-publish
    permissions:
      contents: write
    env:
      INPUT_CHANNEL: ${{ inputs.channel }}
      INPUT_CATALOG_VERSION: ${{ inputs.catalog_version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install .
      - name: Validate reviewed repository state
        run: |
          test -s keys/public/catalog-release-v1.pem
          sb-models repo-check --repo-root .
      - name: Materialize staged objects this release will upload
        run: |
          mkdir -p staging catalog
          if [ "$INPUT_CHANNEL" = "test" ]; then
            sb-models build-canary --repo-root . --staging-root staging
          fi
          # beta/stable staging (real model/runtime bytes from the private R2
          # candidate bucket) is not implemented yet; see docs/cloudflare-setup.md.
          # It is a no-op today because no manifest is currently approved for
          # either channel, so build-catalog produces zero entries for them.
      - name: Build, sign, upload, verify, and publish this catalog release
        env:
          CATALOG_SIGNING_KEY_B64: ${{ secrets.CATALOG_SIGNING_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sb-models publish \
            --repo-root . \
            --staging-root staging \
            --channel "$INPUT_CHANNEL" \
            --catalog-version "$INPUT_CATALOG_VERSION" \
            --public-key keys/public/catalog-release-v1.pem \
            --key-env CATALOG_SIGNING_KEY_B64 \
            --host github-release \
            --repository "$GH_REPOSITORY" \
            --catalog-output "catalog/$INPUT_CHANNEL.json" \
            --signature-output "catalog/$INPUT_CHANNEL.json.sig" \
            --receipt release-receipt.json
      - name: Retain the release receipt as a workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-publish-receipt-${{ github.run_id }}
          path: release-receipt.json
          if-no-files-found: warn
          retention-days: 90
