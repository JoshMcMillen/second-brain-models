name: Publish signed model catalog

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Catalog channel
        required: true
        type: choice
        options: [beta, stable]
      catalog_version:
        description: New monotonic catalog version
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: model-catalog-publish-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: model-publish
    env:
      INPUT_CHANNEL: ${{ inputs.channel }}
      INPUT_CATALOG_VERSION: ${{ inputs.catalog_version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install .
      - name: Validate and build reviewed catalog
        env:
          CATALOG_SIGNING_KEY_B64: ${{ secrets.CATALOG_SIGNING_KEY_B64 }}
        run: |
          test -s keys/public/catalog-release-v1.pem
          sb-models repo-check --repo-root .
          mkdir -p catalog
          sb-models build-catalog --repo-root . --channel "$INPUT_CHANNEL" --catalog-version "$INPUT_CATALOG_VERSION" --public-key keys/public/catalog-release-v1.pem --output "catalog/$INPUT_CHANNEL.json"
          sb-models sign --document "catalog/$INPUT_CHANNEL.json" --signature "catalog/$INPUT_CHANNEL.json.sig" --key-env CATALOG_SIGNING_KEY_B64
          sb-models verify --document "catalog/$INPUT_CHANNEL.json" --signature "catalog/$INPUT_CHANNEL.json.sig" --public-key keys/public/catalog-release-v1.pem
      - name: Publication disabled until artifact-first R2 receipt is implemented
        run: |
          echo "FAIL CLOSED: Git catalog state will not change until the workflow uploads every referenced model/runtime/license/result object to the release bucket, downloads each public object again, and verifies its signed path, byte size, and SHA-256." >&2
          echo "See docs/publishing-interface-v1.md." >&2
          exit 1
