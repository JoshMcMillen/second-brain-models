name: Evaluate reviewed local model

on:
  pull_request:
    paths:
      - "evals/**"
      - "models/**"
      - "runtimes/**"
      - "policy/promotion-v1.yaml"
      - "schemas/result-v1.schema.json"
      - "src/second_brain_models/cli.py"
      - "src/second_brain_models/evaluation.py"
      - "src/second_brain_models/evaluation_stage.py"
      - "src/second_brain_models/inference.py"
      - "src/second_brain_models/isolated_evaluator.py"
      - "src/second_brain_models/network_monitor.py"
      - "src/second_brain_models/noegress.py"
      - "src/second_brain_models/runtime_archive.py"
      - "tests/**"
      - ".github/workflows/evaluate.yml"
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Exact reviewed model manifest on the protected default branch
        required: true
        default: models/qwen3-0.6b-q4_k_m/manifest.json
        type: string

permissions:
  contents: read

jobs:
  evaluator-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out protected base evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out proposed fixtures and policy as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: untrusted
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install './trusted[test]'
      - name: Validate proposal with protected evaluator code
        run: |
          set -euo pipefail
          audit_root="$RUNNER_TEMP/protected-contract-audit"
          mkdir -p "$audit_root"
          cp -a trusted/policy trusted/schemas trusted/evals "$audit_root/"
          for item in models runtimes results catalog revocations; do
            if [ -e "untrusted/$item" ]; then cp -a "untrusted/$item" "$audit_root/"; fi
          done
          sb-models repo-check --repo-root "$audit_root"
          sb-models proposed-contract-check --proposal-root untrusted
          python -m pytest \
            trusted/tests/test_evaluation.py \
            trusted/tests/test_network_monitor.py \
            trusted/tests/test_workflows.py

  implementation-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out proposed implementation without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install '.[test]'
      - run: python -m pytest

  evaluate-exact-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: model-evaluation
    env:
      INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
      EVALUATOR_PLATFORM: linux-x86_64
      EVALUATOR_PORT: "8080"
      EVALUATION_ROOT: /opt/second-brain-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out protected default-branch evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned evaluator and namespace tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          python -m pip install .
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace
          {
            git rev-parse HEAD
            python --version
            strace --version | head -n 1
            unshare --version | head -n 1
            setpriv --version | head -n 1
            ip -Version
          } > "$RUNNER_TEMP/receipts/toolchain.txt"
      - name: Validate and download exact public inputs
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_MANIFEST_PATH" =~ ^models/[a-z0-9][a-z0-9._-]*/manifest\.json$ ]]; then
            echo "Manifest path is not canonical." >&2
            exit 2
          fi
          sb-models repo-check --repo-root "$GITHUB_WORKSPACE"
          sb-models evaluation-stage \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "$GITHUB_WORKSPACE/$INPUT_MANIFEST_PATH" \
            --platform "$EVALUATOR_PLATFORM" \
            --staging-root "$RUNNER_TEMP/staging" \
            --receipt "$RUNNER_TEMP/receipts/download.json"
      - name: Resolve validated content-addressed paths
        id: exact
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/receipts/download.json"
          runtime_manifest=$(jq -er '.runtime.manifest_path // empty' "$GITHUB_WORKSPACE/$INPUT_MANIFEST_PATH")
          model_relative=$(jq -er '.model.path' "$receipt")
          runtime_relative=$(jq -er '.runtime.path' "$receipt")
          executable_relative=$(jq -er '.runtime.executable_path' "$receipt")
          {
            printf 'manifest_path=%s\n' "$GITHUB_WORKSPACE/$INPUT_MANIFEST_PATH"
            printf 'model_path=%s\n' "$RUNNER_TEMP/staging/$model_relative"
            printf 'runtime_manifest=%s\n' "$GITHUB_WORKSPACE/$runtime_manifest"
            printf 'runtime_archive=%s\n' "$RUNNER_TEMP/staging/$runtime_relative"
            printf 'runtime_executable=%s\n' "$RUNNER_TEMP/runtime/$executable_relative"
            printf 'isolated_model_path=%s\n' "$EVALUATION_ROOT/model.gguf"
            printf 'isolated_runtime_root=%s\n' "$EVALUATION_ROOT/runtime"
            printf 'isolated_runtime_executable=%s\n' "$EVALUATION_ROOT/runtime/$executable_relative"
            printf 'runtime_scratch_root=%s\n' "$EVALUATION_ROOT/runtime-scratch"
            printf 'runtime_version=%s\n' "$(jq -er '.runtime.version' "$receipt")"
            printf 'runtime_package_sha256=%s\n' "$(jq -er '.runtime.sha256' "$receipt")"
          } >> "$GITHUB_OUTPUT"
      - name: Run static checks and guarded extraction
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          sb-models candidate-check \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "${{ steps.exact.outputs.manifest_path }}" \
            --artifact-root "$RUNNER_TEMP/staging" \
            --report "$RUNNER_TEMP/receipts/candidate-pre.json"
          sb-models runtime-package-check \
            --repo-root "$GITHUB_WORKSPACE" \
            --runtime-manifest "${{ steps.exact.outputs.runtime_manifest }}" \
            --package-root "$RUNNER_TEMP/staging" \
            --platform "$EVALUATOR_PLATFORM" \
            --report "$RUNNER_TEMP/receipts/runtime-pre.json"
          sb-models runtime-extract \
            --repo-root "$GITHUB_WORKSPACE" \
            --runtime-manifest "${{ steps.exact.outputs.runtime_manifest }}" \
            --package-root "$RUNNER_TEMP/staging" \
            --platform "$EVALUATOR_PLATFORM" \
            --destination "$RUNNER_TEMP/runtime" \
            > "$RUNNER_TEMP/receipts/runtime-extract.json"

          # Materialize only the already-validated inputs in a fresh path whose
          # ancestors are traversable by the dropped runtime identity. Evidence
          # remains under the runner's private temporary directory.
          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "GitHub run identity is not numeric." >&2
            exit 2
          fi
          sudo test ! -e "$EVALUATION_ROOT"
          sudo test ! -L "$EVALUATION_ROOT"
          sudo mkdir --mode=0755 "$EVALUATION_ROOT"
          sudo install -d -o root -g root -m 0755 "$EVALUATION_ROOT/runtime"
          sudo install -o root -g root -m 0444 \
            "${{ steps.exact.outputs.model_path }}" \
            "${{ steps.exact.outputs.isolated_model_path }}"
          sudo cp -a "$RUNNER_TEMP/runtime/." "$EVALUATION_ROOT/runtime/"
          sudo chown -R root:root "$EVALUATION_ROOT/runtime"
          sudo find "$EVALUATION_ROOT/runtime" -type d -exec chmod 0555 {} +
          sudo find "$EVALUATION_ROOT/runtime" -type f -exec chmod 0444 {} +
          sudo chmod 0555 "${{ steps.exact.outputs.isolated_runtime_executable }}"
          if find "$EVALUATION_ROOT/runtime" ! -type d ! -type f -print -quit | grep -q .; then
            echo "Isolated runtime tree contains a non-regular member." >&2
            exit 2
          fi
          sudo chown root:root \
            "${{ steps.exact.outputs.model_path }}" \
            "${{ steps.exact.outputs.runtime_archive }}"
          sudo chmod 0444 \
            "${{ steps.exact.outputs.model_path }}" \
            "${{ steps.exact.outputs.runtime_archive }}"
          cmp "${{ steps.exact.outputs.model_path }}" \
            "${{ steps.exact.outputs.isolated_model_path }}"
          cmp "${{ steps.exact.outputs.runtime_executable }}" \
            "${{ steps.exact.outputs.isolated_runtime_executable }}"
          sudo -u nobody /usr/bin/test -x \
            "${{ steps.exact.outputs.isolated_runtime_executable }}"
          sudo -u nobody /usr/bin/test -r \
            "${{ steps.exact.outputs.isolated_model_path }}"
          runtime_tree_receipt() {
            local tree_root="$1"
            (
              cd "$tree_root"
              find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
            )
          }
          runtime_tree_receipt "$RUNNER_TEMP/runtime" \
            > "$RUNNER_TEMP/receipts/extracted-runtime-tree.sha256"
          runtime_tree_receipt "$EVALUATION_ROOT/runtime" \
            > "$RUNNER_TEMP/receipts/isolated-runtime-tree-pre.sha256"
          cmp "$RUNNER_TEMP/receipts/extracted-runtime-tree.sha256" \
            "$RUNNER_TEMP/receipts/isolated-runtime-tree-pre.sha256"
          sha256sum "${{ steps.exact.outputs.isolated_model_path }}" \
            > "$RUNNER_TEMP/receipts/isolated-model-pre.sha256"
          sha256sum "${{ steps.exact.outputs.isolated_runtime_executable }}" \
            > "$RUNNER_TEMP/receipts/runtime-executable-pre.sha256"
      - name: Run runtime and synthetic suite in one disconnected namespace
        run: |
          set -euo pipefail
          python_binary=$(command -v python)
          isolation_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo unshare \
            --mount --net --pid --fork --mount-proc --kill-child=SIGKILL \
            "$python_binary" -m second_brain_models isolated-supervisor \
            --repo-root "$GITHUB_WORKSPACE" \
            --python-executable "$python_binary" \
            --runtime-root "${{ steps.exact.outputs.isolated_runtime_root }}" \
            --runtime-executable "${{ steps.exact.outputs.isolated_runtime_executable }}" \
            --model "${{ steps.exact.outputs.isolated_model_path }}" \
            --port "$EVALUATOR_PORT" \
            --isolation-id "$isolation_id" \
            --supervisor-root "$RUNNER_TEMP/evidence/supervisor" \
            --runtime-output-root "$RUNNER_TEMP/evidence/runtime" \
            --runtime-scratch-root "${{ steps.exact.outputs.runtime_scratch_root }}" \
            --artifact-reader-gid "$(id -g)"
      - name: Validate process-tree trace and no-egress evidence
        run: |
          set -euo pipefail
          jq -e '.status == "completed" and .shutdown_traced == true and .tracer_exit_code == 0 and .namespace.network == "new" and .namespace.pid == "new" and .namespace.mount == "new"' \
            "$RUNNER_TEMP/evidence/supervisor/supervisor.json" > /dev/null
          shopt -s nullglob
          trace_files=("$RUNNER_TEMP"/evidence/supervisor/strace/runtime.*)
          if (( ${#trace_files[@]} == 0 )); then
            echo "No runtime syscall trace was retained." >&2
            exit 2
          fi
          sb-models network-monitor-check \
            --network-trace "${trace_files[@]}" \
            --expected-runtime-executable "${{ steps.exact.outputs.isolated_runtime_executable }}" \
            --output "$RUNNER_TEMP/receipts/network-monitor.json"
          sb-models merge-isolation-evidence \
            --probe "$RUNNER_TEMP/evidence/runtime/probe.json" \
            --monitor "$RUNNER_TEMP/receipts/network-monitor.json" \
            --output "$RUNNER_TEMP/receipts/isolation.json"
      - name: Revalidate exact bytes after inference
        run: |
          set -euo pipefail
          sb-models candidate-check \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "${{ steps.exact.outputs.manifest_path }}" \
            --artifact-root "$RUNNER_TEMP/staging" \
            --report "$RUNNER_TEMP/receipts/candidate-post.json"
          sb-models runtime-package-check \
            --repo-root "$GITHUB_WORKSPACE" \
            --runtime-manifest "${{ steps.exact.outputs.runtime_manifest }}" \
            --package-root "$RUNNER_TEMP/staging" \
            --platform "$EVALUATOR_PLATFORM" \
            --report "$RUNNER_TEMP/receipts/runtime-post.json"
          sha256sum "${{ steps.exact.outputs.isolated_model_path }}" \
            > "$RUNNER_TEMP/receipts/isolated-model-post.sha256"
          (
            cd "$EVALUATION_ROOT/runtime"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum
          ) > "$RUNNER_TEMP/receipts/isolated-runtime-tree-post.sha256"
          sha256sum "${{ steps.exact.outputs.isolated_runtime_executable }}" \
            > "$RUNNER_TEMP/receipts/runtime-executable-post.sha256"
          cmp "$RUNNER_TEMP/receipts/candidate-pre.json" "$RUNNER_TEMP/receipts/candidate-post.json"
          cmp "$RUNNER_TEMP/receipts/runtime-pre.json" "$RUNNER_TEMP/receipts/runtime-post.json"
          cmp "$RUNNER_TEMP/receipts/isolated-model-pre.sha256" "$RUNNER_TEMP/receipts/isolated-model-post.sha256"
          cmp "$RUNNER_TEMP/receipts/isolated-runtime-tree-pre.sha256" "$RUNNER_TEMP/receipts/isolated-runtime-tree-post.sha256"
          cmp "$RUNNER_TEMP/receipts/runtime-executable-pre.sha256" "$RUNNER_TEMP/receipts/runtime-executable-post.sha256"
      - name: Score deterministic quality gate
        run: |
          set -euo pipefail
          supervisor="$RUNNER_TEMP/evidence/supervisor/supervisor.json"
          isolation_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sb-models evaluate \
            --repo-root "$GITHUB_WORKSPACE" \
            --manifest "${{ steps.exact.outputs.manifest_path }}" \
            --predictions "$RUNNER_TEMP/evidence/runtime/predictions.jsonl" \
            --output "$RUNNER_TEMP/evidence/result.json" \
            --runner-id github-actions-isolated \
            --runner-version 0.1.0 \
            --runtime-version "${{ steps.exact.outputs.runtime_version }}" \
            --runtime-platform "$EVALUATOR_PLATFORM" \
            --runtime-package-sha256 "${{ steps.exact.outputs.runtime_package_sha256 }}" \
            --isolation-id "$isolation_id" \
            --isolation-evidence "$RUNNER_TEMP/receipts/isolation.json" \
            --runtime-started-at "$(jq -er '.runtime_started_at' "$supervisor")" \
            --inference-started-at "$(jq -er '.inference_started_at' "$supervisor")" \
            --inference-finished-at "$(jq -er '.inference_finished_at' "$supervisor")" \
            --runtime-finished-at "$(jq -er '.runtime_finished_at' "$supervisor")" \
            --require-pass
      - name: Retain evaluation result and security receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/receipts
            ${{ runner.temp }}/evidence/supervisor
            ${{ runner.temp }}/evidence/runtime/predictions.jsonl
            ${{ runner.temp }}/evidence/runtime/probe.json
            ${{ runner.temp }}/evidence/result.json
          if-no-files-found: error
          retention-days: 30
