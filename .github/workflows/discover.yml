name: Discover model candidates

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned tooling dependencies
        run: python -m pip install .
      - name: Validate trust policy before discovery
        run: sb-models repo-check --repo-root .
      - name: Fetch allowlisted publisher metadata only
        run: sb-models discover --repo-root . --output discovery-report.json
      - name: Retain discovery report for owner review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: model-discovery-${{ github.run_id }}
          path: discovery-report.json
          if-no-files-found: error
          retention-days: 30
